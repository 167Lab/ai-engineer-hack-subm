services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  airflow-webserver:
    build: ./infra/airflow
    container_name: airflow-webserver
    command: webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _AIRFLOW_UID=50000
      - _AIRFLOW_GID=0
    ports:
      - "8080:8080"
    volumes:
      - ./infra/airflow/dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./sample_data:/opt/airflow/data

  airflow-scheduler:
    build: ./infra/airflow
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _AIRFLOW_UID=50000
      - _AIRFLOW_GID=0
    volumes:
      - ./infra/airflow/dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./sample_data:/opt/airflow/data

  airflow-init:
    build: ./infra/airflow
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command: -c "airflow db init && airflow users create --username admin --password admin --firstname Anonymous --lastname User --role Admin --email admin@example.org"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _AIRFLOW_UID=50000
      - _AIRFLOW_GID=0

 # HDFS single-node (NameNode + DataNode)
  hadoop-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-namenode
    ports:
      - "9870:9870"      # WebHDFS + веб-UI NameNode
      - "9000:9000"      # RPC-порт (то, что в fs.defaultFS)
    environment:
      - CLUSTER_NAME=hadoop-demo
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:9000
      - HDFS_CONF_dfs_replication=1
    volumes:
      - ./data/hadoop/namenode:/hadoop/dfs/name

  hadoop-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-datanode
    depends_on:
      - hadoop-namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:9000
      - HDFS_CONF_dfs_replication=1
      # чтобы датанод ждал, пока NN поднимет веб-порт:
      - SERVICE_PRECONDITION=hadoop-namenode:9870
    volumes:
      - ./data/hadoop/datanode:/hadoop/dfs/data
      
  # Базы данных
  clickhouse:
    image: clickhouse/clickhouse-server:23.3
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      
  # Backend API
  backend-api:
    build: ./backend
    volumes:
      - ./backend:/app
      - ./sample_data:/app/data
      - ./infra/airflow/dags:/opt/airflow/dags
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - clickhouse
      
  # Frontend UI
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-api

networks:
  default:
    driver: bridge
